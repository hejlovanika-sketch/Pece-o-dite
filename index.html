<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Davídkův kalendář</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #777;
      --line: #e7e7e7;
      --soft: #f2f2f2;
      --dark: #222;
      --danger: #a50000;
      --danger-bg: #fae9e9;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 82px;
    }

    /* =============================
       HLAVIČKA
    ============================= */

    .header {
      padding: 18px 18px 5px;
      background: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-sketch {
      width: 55px;
      height: 55px;
      flex: 0 0 55px;
    }

    .app-title {
      margin: 0;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 800;
    }

    .month-bar {
      margin-top: 15px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
    }

    .month-name {
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .today-link {
      display: block;
      margin: 3px auto 0;
      border: 0;
      background: transparent;
      color: #666;
      font-size: 13px;
      font-weight: 700;
      padding: 4px;
    }

    .round-btn {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
    }

    .round-btn svg {
      width: 22px;
      height: 22px;
    }

    /* =============================
       KALENDÁŘ
    ============================= */

    .calendar-area {
      padding: 7px 12px 20px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      padding: 4px 0 7px;
      color: #777;
      font-size: 12px;
      font-weight: 750;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .day {
      min-height: 64px;
      padding: 5px 4px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: white;
      overflow: hidden;
    }

    .day.other-month {
      background: #fafafa;
      color: #bbb;
    }

    .day-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    .day.today .day-number {
      background: #222;
      color: white;
    }

    .day-icons {
      min-height: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px;
      padding-top: 5px;
    }

    .day-icons svg {
      width: 14px;
      height: 14px;
      color: #222;
      stroke-width: 1.9;
    }

    .day.other-month .day-icons svg {
      color: #aaa;
    }

    .soccer-icon {
      width: 14px;
      height: 14px;
      color: #222;
      display: inline-block;
    }

    .more-icons {
      font-size: 9px;
      color: #777;
      font-weight: 700;
    }

    /* =============================
       OBRAZOVKY
    ============================= */

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .content {
      padding: 13px 15px 25px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 16px;
      margin-bottom: 13px;
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    /* =============================
       SPODNÍ MENU
    ============================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(620px, 100%);
      min-height: 68px;
      padding: 7px 8px max(7px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #888;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .nav-btn.active {
      color: #111;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
    }

    /* =============================
       MODALY
    ============================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(620px, 100%);
      max-height: 93vh;
      overflow-y: auto;
      background: white;
      padding: 8px 18px 28px;
      border-radius: 24px 24px 0 0;
    }

    .modal-grip {
      width: 42px;
      height: 5px;
      background: #ddd;
      border-radius: 10px;
      margin: 3px auto 15px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .modal-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--soft);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =============================
       DETAIL DNE
    ============================= */

    .day-event {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .day-event:last-child {
      border-bottom: 0;
    }

    .event-icon {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 37px;
    }

    .event-icon svg {
      width: 20px;
      height: 20px;
      color: #222;
    }

    .event-icon .soccer-icon {
      width: 21px;
      height: 21px;
    }

    .event-main {
      flex: 1;
      min-width: 0;
    }

    .event-name {
      font-size: 16px;
      font-weight: 800;
    }

    .event-meta {
      margin-top: 4px;
      color: #707070;
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      color: #999;
      font-size: 14px;
      padding: 10px 0;
    }

    .day-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    .secret-toggle-wrap {
      text-align: center;
      margin-top: 13px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    .secret-toggle {
      width: 52px;
      height: 39px;
      border: 0;
      background: transparent;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: #555;
    }

    .secret-toggle svg {
      width: 27px;
      height: 27px;
    }

    .secret-section {
      display: none;
      padding-top: 7px;
    }

    .secret-section.open {
      display: block;
    }

    .secret-subtitle {
      font-size: 13px;
      color: #888;
      font-weight: 700;
      margin: 12px 0 7px;
    }

    .care-row {
      padding: 10px 11px;
      margin-bottom: 7px;
      border-left: 5px solid #aaa;
      border-radius: 10px;
      background: #f7f7f7;
    }

    .care-person {
      font-weight: 800;
    }

    .care-meta {
      margin-top: 3px;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    .companion-row {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 10px 11px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    /* =============================
       FORM
    ============================= */

    label {
      display: block;
      margin: 0 0 5px;
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d5d5d5;
      border-radius: 11px;
      background: white;
      padding: 12px;
      margin-bottom: 13px;
      font-size: 16px;
      color: #222;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
    }

    .btn-dark {
      background: #222;
      color: white;
    }

    .btn-soft {
      background: #efefef;
      color: #222;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* =============================
       VÝBĚR TYPU AKCE
    ============================= */

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .activity-choice {
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      min-height: 82px;
      padding: 9px 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    .activity-choice.active {
      border: 2px solid #222;
      padding: 8px 4px;
      background: #f7f7f7;
    }

    .activity-choice svg {
      width: 24px;
      height: 24px;
    }

    .activity-choice .soccer-icon {
      width: 25px;
      height: 25px;
    }

    /* =============================
       OPAKOVÁNÍ
    ============================= */

    .repeat-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #efefef;
      border-radius: 11px;
      padding: 3px;
      margin-bottom: 15px;
    }

    .repeat-switch button {
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 10px;
      font-size: 13px;
      font-weight: 750;
      color: #666;
    }

    .repeat-switch button.active {
      background: #222;
      color: white;
    }

    .repeat-panel {
      display: none;
    }

    .repeat-panel.open {
      display: block;
    }

    .weekday-picker {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }

    .weekday-btn {
      border: 1px solid #ddd;
      border-radius: 50%;
      background: white;
      aspect-ratio: 1/1;
      font-size: 11px;
      font-weight: 800;
      color: #555;
    }

    .weekday-btn.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    /* =============================
       PŘEHLED
    ============================= */

    .overview-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      background: #efefef;
      border-radius: 11px;
      margin-bottom: 14px;
    }

    .overview-tab {
      border: 0;
      border-radius: 9px;
      background: transparent;
      padding: 9px 5px;
      color: #666;
      font-size: 13px;
      font-weight: 800;
    }

    .overview-tab.active {
      background: #222;
      color: white;
    }

    .overview-item {
      display: grid;
      grid-template-columns: 35px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }

    .overview-item:last-child {
      border-bottom: 0;
    }

    .overview-item-icon {
      width: 31px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overview-item-icon svg {
      width: 20px;
      height: 20px;
    }

    .overview-item-icon .soccer-icon {
      width: 21px;
      height: 21px;
    }

    .overview-count {
      font-weight: 800;
    }

    .overview-secret {
      display: none;
      margin-top: 8px;
    }

    .overview-secret.open {
      display: block;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .stat-row:last-child {
      border-bottom: 0;
    }

    .stat-person {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .person-dot {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      border-radius: 50%;
    }

    .small {
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    /* =============================
       NASTAVENÍ
    ============================= */

    .people-list {
      display: grid;
      gap: 8px;
    }

    .person-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
    }

    /* =============================
       LOGIN
    ============================= */

    .login-wrap {
      padding: 50px 18px;
    }

    .login-card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 23px;
      border-radius: 20px;
      border: 1px solid var(--line);
    }

    .login-title {
      margin: 0 0 20px;
      font-size: 27px;
    }

    .message {
      margin-top: 10px;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .day {
        min-height: 59px;
      }

      .app-title {
        font-size: 26px;
      }

      .brand-sketch {
        width: 49px;
        height: 49px;
        flex-basis: 49px;
      }

      .activity-choice {
        min-height: 78px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap">

    <div class="login-card">

      <h1 class="login-title">Davídkův kalendář</h1>

      <label>E-mail</label>
      <input id="loginEmail" type="email">

      <label>Heslo</label>
      <input id="loginPassword" type="password">

      <button class="btn btn-dark" style="width:100%" onclick="login()">
        Přihlásit
      </button>

      <div id="loginMessage"></div>

    </div>

  </div>


  <div id="mainApp" class="hidden">

    <!-- KALENDÁŘ -->
    <section id="calendarScreen" class="screen active">

      <div class="header">

        <div class="brand">

          <svg class="brand-sketch" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M25 14c5-6 14-6 19 0"/>
            <circle cx="35" cy="22" r="9"/>
            <path d="M29 31l-8 18m20-18 8 17M31 32l-3 18m11-18 4 18"/>
            <path d="M28 49 17 62m26-13 13 12"/>
            <path d="M16 62l-8 2m48-3 7 3"/>
            <path d="M26 35c6 4 12 4 17 0"/>
            <circle cx="59" cy="59" r="10"/>
            <path d="m59 49 4 4-1 5-6 1-4-4 2-5z"/>
            <path d="m62 58 6 3m-12-2-3 7m1-11-6-1"/>
          </svg>

          <h1 class="app-title">Davídkův<br>kalendář</h1>

        </div>

        <div class="month-bar">

          <button class="round-btn" onclick="changeMonth(-1)">
            <i data-lucide="chevron-left"></i>
          </button>

          <div>
            <div id="monthTitle" class="month-name"></div>

            <button class="today-link" onclick="goToday()">
              Dnes
            </button>
          </div>

          <button class="round-btn" onclick="changeMonth(1)">
            <i data-lucide="chevron-right"></i>
          </button>

        </div>

      </div>

      <div class="calendar-area">

        <div class="weekdays">
          <div>Po</div>
          <div>Út</div>
          <div>St</div>
          <div>Čt</div>
          <div>Pá</div>
          <div>So</div>
          <div>Ne</div>
        </div>

        <div id="calendar" class="calendar"></div>

      </div>

    </section>


    <!-- PŘEHLED -->
    <section id="overviewScreen" class="screen">

      <div class="header">
        <h1 class="app-title">Přehled</h1>
      </div>

      <div class="content">

        <div class="overview-tabs">

          <button class="overview-tab" data-period="week"
            onclick="setOverviewPeriod('week')">
            Týden
          </button>

          <button class="overview-tab active" data-period="month"
            onclick="setOverviewPeriod('month')">
            Měsíc
          </button>

          <button class="overview-tab" data-period="year"
            onclick="setOverviewPeriod('year')">
            Rok
          </button>

        </div>

        <div class="card">

          <h2 id="overviewTitle" class="card-title"></h2>

          <div id="overviewActivities"></div>

        </div>

        <div class="secret-toggle-wrap">

          <button class="secret-toggle" onclick="toggleOverviewSecret()">
            <i data-lucide="menu"></i>
          </button>

        </div>

        <div id="overviewSecret" class="overview-secret">

          <div class="card">

            <div id="careStats"></div>

          </div>

          <div class="card">

            <div id="companionStats"></div>

          </div>

        </div>

      </div>

    </section>


    <!-- NASTAVENÍ -->
    <section id="settingsScreen" class="screen">

      <div class="header">
        <h1 class="app-title">Nastavení</h1>
      </div>

      <div class="content">

        <div class="card">

          <h2 class="card-title">Osoby</h2>

          <div id="peopleList" class="people-list"></div>

          <button
            class="btn btn-soft"
            style="width:100%;margin-top:13px"
            onclick="openPersonModal()">
            + Přidat osobu
          </button>

        </div>

        <div class="card">

          <button class="btn btn-soft" style="width:100%" onclick="logout()">
            Odhlásit
          </button>

        </div>

      </div>

    </section>


    <!-- NAV -->
    <nav class="bottom-nav">

      <button class="nav-btn active" onclick="showScreen('calendarScreen',this)">
        <i data-lucide="calendar-days"></i>
        Kalendář
      </button>

      <button class="nav-btn" onclick="showScreen('overviewScreen',this)">
        <i data-lucide="chart-no-axes-column"></i>
        Přehled
      </button>

      <button class="nav-btn" onclick="showScreen('settingsScreen',this)">
        <i data-lucide="settings"></i>
        Nastavení
      </button>

    </nav>

  </div>

</div>


<!-- DETAIL DNE -->
<div id="dayModal" class="modal">

  <div class="modal-box">

    <div class="modal-grip"></div>

    <div class="modal-head">

      <h2 id="dayModalTitle" class="modal-title"></h2>

      <button class="close-btn" onclick="closeModal('dayModal')">
        <i data-lucide="x"></i>
      </button>

    </div>

    <div id="dayEvents"></div>

    <div class="day-actions">

      <button class="btn btn-dark" onclick="openActivityModal()">
        + Akce
      </button>

      <button class="btn btn-soft" onclick="openSchoolModal()">
        + Škola
      </button>

    </div>

    <div class="secret-toggle-wrap">

      <button class="secret-toggle" onclick="toggleDaySecret()">
        <i data-lucide="menu"></i>
      </button>

      <div id="daySecret" class="secret-section">

        <div id="dayCareList"></div>

        <div id="dayCompanionList"></div>

        <button
          class="btn btn-soft"
          style="width:100%;margin-top:7px"
          onclick="openCareModal()">
          + Přidat
        </button>

      </div>

    </div>

  </div>

</div>


<!-- AKCE -->
<div id="activityModal" class="modal">

  <div class="modal-box">

    <div class="modal-grip"></div>

    <div class="modal-head">

      <h2 id="activityModalTitle" class="modal-title">
        Přidat akci
      </h2>

      <button class="close-btn" onclick="closeModal('activityModal')">
        <i data-lucide="x"></i>
      </button>

    </div>

    <label>Typ akce</label>

    <div id="activityTypeGrid" class="activity-grid"></div>

    <div class="repeat-switch">

      <button id="singleBtn" class="active" onclick="setRepeatMode(false)">
        Jednorázově
      </button>

      <button id="repeatBtn" onclick="setRepeatMode(true)">
        Opakovat
      </button>

    </div>


    <!-- JEDNORÁZOVÁ -->
    <div id="singleActivityPanel">

      <label>Od</label>
      <input id="activityStart" type="datetime-local">

      <label>Do</label>
      <input id="activityEnd" type="datetime-local">

    </div>


    <!-- OPAKOVÁNÍ -->
    <div id="repeatActivityPanel" class="repeat-panel">

/* =====================================================
   KALENDÁŘ
===================================================== */

function changeMonth(diff) {

  currentMonth =
    new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth() + diff,
      1
    );

  loadMonthData();
}


function goToday() {

  currentMonth =
    new Date();

  currentMonth.setDate(1);

  loadMonthData();
}


async function loadMonthData() {

  const gridStart =
    startOfCalendarGrid(
      currentMonth
    );

  const gridEnd =
    endOfCalendarGrid(
      currentMonth
    );

  const [
    careResult,
    activityResult,
    schoolResult
  ] =
    await Promise.all([

      db
        .from("care_periods")
        .select(`
          *,
          people (
            id,
            name,
            color
          )
        `)
        .lt(
          "start_at",
          gridEnd.toISOString()
        )
        .gt(
          "end_at",
          gridStart.toISOString()
        ),

      db
        .from("activities")
        .select(`
          *,
          people:companion_person_id (
            id,
            name,
            color
          )
        `)
        .gte(
          "start_at",
          gridStart.toISOString()
        )
        .lt(
          "start_at",
          gridEnd.toISOString()
        ),

      db
        .from("school_events")
        .select(`
          *,
          people (
            id,
            name,
            color
          )
        `)
        .gte(
          "event_date",
          dateKey(gridStart)
        )
        .lt(
          "event_date",
          dateKey(gridEnd)
        )

    ]);

  monthCare =
    careResult.data || [];

  monthActivities =
    activityResult.data || [];

  monthSchool =
    schoolResult.data || [];

  document
    .getElementById("monthTitle")
    .textContent =
      currentMonth
        .toLocaleDateString(
          "cs-CZ",
          {
            month: "long",
            year: "numeric"
          }
        );

  renderCalendar();
}


function renderCalendar() {

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";

  const gridStart =
    startOfCalendarGrid(
      currentMonth
    );

  const gridEnd =
    endOfCalendarGrid(
      currentMonth
    );

  const days =
    Math.round(
      (
        gridEnd.getTime() -
        gridStart.getTime()
      )
      /
      86400000
    );

  for (
    let i = 0;
    i < days;
    i++
  ) {

    const day =
      new Date(gridStart);

    day.setDate(
      gridStart.getDate() + i
    );

    const key =
      dateKey(day);

    const cell =
      document.createElement("div");

    cell.className = "day";

    if (
      day.getMonth() !==
      currentMonth.getMonth()
    ) {

      cell
        .classList
        .add("other-month");
    }

    if (
      key ===
      dateKey(new Date())
    ) {

      cell
        .classList
        .add("today");
    }

    cell.onclick =
      () => openDay(key);


    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent =
      day.getDate();

    cell.appendChild(number);


    const activities =
      monthActivities
        .filter(
          item =>
            dateKey(
              new Date(item.start_at)
            ) === key
        );


    const icons =
      document.createElement("div");

    icons.className =
      "day-icons";


    activities
      .slice(0,4)
      .forEach(
        item => {

          const type =
            findActivityType(
              item.title
            );

          icons.appendChild(
            makeIconElement(
              type.icon
            )
          );
        }
      );


    if (
      activities.length > 4
    ) {

      const more =
        document.createElement("span");

      more.className =
        "more-icons";

      more.textContent =
        "+" +
        (
          activities.length -
          4
        );

      icons.appendChild(more);
    }


    cell.appendChild(icons);

    calendar.appendChild(cell);
  }

  refreshIcons();
}

   DETAIL DNE
===================================================== */

function openDay(key) {

  selectedDate = key;

  document
    .getElementById("daySecret")
    .classList
    .remove("open");

  const date =
    parseDateKey(key);

  document
    .getElementById("dayModalTitle")
    .textContent =
      date
        .toLocaleDateString(
          "cs-CZ",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        );

  renderDayEvents();
  renderDayCare();
  renderDayCompanions();

  openModal("dayModal");
}


function renderDayEvents() {

  const box =
    document
      .getElementById("dayEvents");

  box.innerHTML = "";

  const activities =
    monthActivities
      .filter(
        item =>
          dateKey(
            new Date(item.start_at)
          ) ===
          selectedDate
      )
      .sort(
        (a,b) =>
          new Date(a.start_at) -
          new Date(b.start_at)
      );


  if (!activities.length) {

    box.innerHTML =
      `<div class="empty">
        Na tento den zatím není naplánovaná žádná akce.
      </div>`;
  }


  activities.forEach(
    item => {

      const type =
        findActivityType(
          item.title
        );

      const row =
        document.createElement("div");

      row.className =
        "day-event";

      row.onclick =
        () =>
          editActivity(item);

      const iconBox =
        document.createElement("div");

      iconBox.className =
        "event-icon";

      iconBox.appendChild(
        makeIconElement(
          type.icon
        )
      );


      const main =
        document.createElement("div");

      main.className =
        "event-main";

      main.innerHTML = `
        <div class="event-name">
          ${safe(item.title)}
        </div>

        <div class="event-meta">

          ${formatTime(item.start_at)}

          ${
            item.end_at
              ? " – " +
                formatTime(
                  item.end_at
                )
              : ""
          }

          ${
            item.location
              ? "<br>" +
                safe(item.location)
              : ""
          }

          ${
            item.note
              ? "<br>" +
                safe(item.note)
              : ""
          }

        </div>
      `;

      row.appendChild(iconBox);
      row.appendChild(main);

      box.appendChild(row);
    }
  );


  refreshIcons();
}


function toggleDaySecret() {

  document
    .getElementById("daySecret")
    .classList
    .toggle("open");
}


function renderDayCare() {

  const box =
    document
      .getElementById("dayCareList");

  box.innerHTML = "";

  const day =
    parseDateKey(
      selectedDate
    );

  const dayStart =
    new Date(
      day.getFullYear(),
      day.getMonth(),
      day.getDate()
    );

  const dayEnd =
    new Date(
      day.getFullYear(),
      day.getMonth(),
      day.getDate() + 1
    );


  const care =
    monthCare
      .filter(
        item => {

          const s =
            new Date(
              item.start_at
            );

          const e =
            new Date(
              item.end_at
            );

          return (
            s < dayEnd &&
            e > dayStart
          );
        }
      )
      .sort(
        (a,b) =>
          new Date(a.start_at) -
          new Date(b.start_at)
      );


  if (!care.length) {

    box.innerHTML =
      `<div class="empty">
        Bez záznamu.
      </div>`;

    return;
  }


  care.forEach(
    item => {

      const s =
        new Date(
          Math.max(
            new Date(
              item.start_at
            ).getTime(),
            dayStart.getTime()
          )
        );

      const e =
        new Date(
          Math.min(
            new Date(
              item.end_at
            ).getTime(),
            dayEnd.getTime()
          )
        );


      const row =
        document.createElement("div");

      row.className =
        "care-row";

      row.style.borderLeftColor =
        item.people?.color ||
        "#999";

      row.onclick =
        () =>
          editCare(item);

      row.innerHTML = `
        <div class="care-person">
          ${safe(
            item.people?.name ||
            "Osoba"
          )}
        </div>

        <div class="care-meta">

          ${formatOnlyTime(s)}
          –
          ${
            e.getTime() ===
            dayEnd.getTime()
              ? "24:00"
              : formatOnlyTime(e)
          }

          ${
            item.record_type ===
            "planned"
              ? " · plán"
              : ""
          }

          ${
            item.note
              ? "<br>" +
                safe(item.note)
              : ""
          }

        </div>
      `;

      box.appendChild(row);
    }
  );
}

/* =====================================================
   TYPY AKCÍ
===================================================== */

function renderActivityChoices() {

  const grid =
    document
      .getElementById(
        "activityTypeGrid"
      );

  grid.innerHTML = "";

  activityTypes.forEach(
    type => {

      const button =
        document
          .createElement("button");

      button.className =
        "activity-choice";

      button.dataset.type =
        type.name;

      button.onclick =
        () =>
          selectActivityType(
            type.name
          );

      button.appendChild(
        makeIconElement(
          type.icon
        )
      );

      const span =
        document.createElement("span");

      span.textContent =
        type.name;

      button.appendChild(span);

      grid.appendChild(button);
    }
  );

  selectActivityType(
    selectedActivityType
  );

  refreshIcons();
}


function selectActivityType(name) {

  selectedActivityType =
    name;

  document
    .querySelectorAll(
      ".activity-choice"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.type ===
            name
          );
      }
    );


  if (
    name === "Nemoc" &&
    !editingActivityId
  ) {

    const d =
      parseDateKey(
        selectedDate
      );

    const start =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate(),
        0,
        1
      );

    const end =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate(),
        23,
        59
      );

    document
      .getElementById(
        "activityStart"
      )
      .value =
        localDateTime(start);

    document
      .getElementById(
        "activityEnd"
      )
      .value =
        localDateTime(end);
  }
}


function findActivityType(name) {

  return (
    activityTypes.find(
      type =>
        type.name === name
    )
    ||
    {
      name,
      icon: "calendar"
    }
  );
}

    repeatMode = false;
    return;

  repeatMode = value;

  document
    .getElementById("singleBtn")
    .classList
    .toggle(
      "active",
      !value
    );

  document
    .getElementById("repeatBtn")
    .classList
    .toggle(
      "active",
      value
    );

  document
    .getElementById(
      "singleActivityPanel"
    )
    .classList
    .toggle(
      "hidden",
      value
    );

  document
    .getElementById(
      "repeatActivityPanel"
    )
    .classList
    .toggle(
      "open",
      value
    );
}


function toggleWeekday(button) {

async function saveActivity() {

  const companion =
    document
      .getElementById(
        "activityCompanion"
      )
      .value;

  const location =
    document
      .getElementById(
        "activityLocation"
      )
      .value
      .trim();

  const note =
    document
      .getElementById(
        "activityNote"
      )
      .value
      .trim();


  if (
    editingActivityId
  ) {

    const start =
      document
        .getElementById(
          "activityStart"
        )
        .value;

    const end =
      document
        .getElementById(
          "activityEnd"
        )
        .value;


    if (!start) {

      alert(
        "Vyplň začátek."
      );

      return;
    }


    const values = {

      user_id:
        currentUser.id,

      title:
        selectedActivityType,

      start_at:
        new Date(
          start
        ).toISOString(),

      end_at:
        end
          ? new Date(
              end
            ).toISOString()
          : null,

      companion_person_id:
        companion || null,

      location:
        location || null,

      note:
        note || null
    };


    const { error } =
      await db
        .from("activities")
        .update(values)
        .eq(
          "id",
          editingActivityId
        );


    if (error) {

      alert(
        error.message
      );

      return;
    }

  }

  else if (
    repeatMode
  ) {

    const weekdays =
      getSelectedWeekdays();

    const fromDate =
      document
        .getElementById(
          "repeatFromDate"
        )
        .value;

    const toDate =
      document
        .getElementById(
          "repeatToDate"
        )
        .value;

    const startTime =
      document
        .getElementById(
          "repeatStartTime"
        )
        .value;

    const endTime =
      document
        .getElementById(
          "repeatEndTime"
        )
        .value;


    if (
      !weekdays.length
      ||
      !fromDate
      ||
      !toDate
      ||
      !startTime
    ) {

      alert(
        "Vyber dny, období a čas."
      );

      return;
    }


    const from =
      parseDateKey(
        fromDate
      );

    const to =
      parseDateKey(
        toDate
      );


    if (
      to < from
    ) {

      alert(
        "Datum „Do“ musí být později."
      );

      return;
    }


    const rows = [];

    const cursor =
      new Date(from);


    while (
      cursor <= to
    ) {

      if (
        weekdays.includes(
          cursor.getDay()
        )
      ) {

        const start =
          combineDateAndTime(
            cursor,
            startTime
          );

        let end = null;

        if (endTime) {

          end =
            combineDateAndTime(
              cursor,
              endTime
            );

          if (
            end <= start
          ) {

            end.setDate(
              end.getDate() + 1
            );
          }
        }


        rows.push({

          user_id:
            currentUser.id,

          title:
            selectedActivityType,

          start_at:
            start.toISOString(),

          end_at:
            end
              ? end.toISOString()
              : null,

          companion_person_id:
            companion || null,

          location:
            location || null,

          note:
            note || null
        });
      }


      cursor.setDate(
        cursor.getDate() + 1
      );
    }


    if (!rows.length) {

      alert(
        "V zadaném období není žádný vybraný den."
      );

      return;
    }


    const { error } =
      await db
        .from("activities")
        .insert(rows);


    if (error) {

      alert(
        error.message
      );

      return;
    }

  }

  else {

    const start =
      document
        .getElementById(
          "activityStart"
        )
        .value;

    const end =
      document
        .getElementById(
          "activityEnd"
        )
        .value;


    if (!start) {

      alert(
        "Vyplň začátek."
      );

      return;
    }


    const { error } =
      await db
        .from("activities")
        .insert({

          user_id:
            currentUser.id,

          title:
            selectedActivityType,

          start_at:
            new Date(
              start
            ).toISOString(),

          end_at:
            end
              ? new Date(
                  end
                ).toISOString()
              : null,

          companion_person_id:
            companion || null,

          location:
            location || null,

          note:
            note || null

        });


    if (error) {

      alert(
        error.message
      );

      return;
    }
  }


  document
    .getElementById(
      "repeatBtn"
    )
    .disabled = false;


  closeModal(
    "activityModal"
  );


  await loadMonthData();

  if (
    document
      .getElementById("dayModal")
      .classList
      .contains("open")
  ) {

    renderDayEvents();
    renderDayCompanions();
  }
}

function renderOverviewActivities(
  activities
) {

  const box =
    document
      .getElementById(
        "overviewActivities"
      );

  const counts = {};


  activities.forEach(
    item => {

      counts[item.title] =
        (
          counts[item.title] ||
          0
        )
        +
        1;
    }
  );


  const entries =
    Object.entries(
      counts
    );


  if (!entries.length) {

    box.innerHTML =
      `<div class="empty">
        Zatím žádné akce.
      </div>`;

    return;
  }


  box.innerHTML = "";


  activityTypes
    .filter(
      type =>
        counts[type.name]
    )
    .forEach(
      type => {

        const row =
          document
            .createElement("div");

        row.className =
          "overview-item";


        const icon =
          document
            .createElement("div");

        icon.className =
          "overview-item-icon";

        icon.appendChild(
          makeIconElement(
            type.icon
          )
        );


        const name =
          document
            .createElement("div");

        name.textContent =
          type.name;


        const count =
          document
            .createElement("div");

        count.className =
          "overview-count";

        count.textContent =
          counts[type.name] +
          "×";


        row.appendChild(icon);
        row.appendChild(name);
        row.appendChild(count);

        box.appendChild(row);
      }
    );


  refreshIcons();
}


function renderCareStats(
  care,
  range
) {

  const box =
    document
      .getElementById(
        "careStats"
      );

  const map = {};


  care.forEach(
    item => {

      const start =
        Math.max(
          new Date(
            item.start_at
          ).getTime(),
          range.start.getTime()
        );

      const end =
        Math.min(
          new Date(
            item.end_at
          ).getTime(),
          range.end.getTime()
        );


      if (
        end <= start
      ) {
        return;
      }


      const id =
        item.person_id;

      const hours =
        (
          end -
          start
        )
        /
        3600000;


      if (!map[id]) {

        map[id] = {

          name:
            item.people?.name ||
            "Osoba",

          color:
            item.people?.color ||
            "#999",

          hours: 0
        };
      }


      map[id].hours +=
        hours;
    }
  );


  const total =
    Object.values(
      map
    )
    .reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.hours,
      0
    );


  box.innerHTML = "";


  Object
    .values(map)
    .sort(
      (a,b) =>
        b.hours -
        a.hours
    )
    .forEach(
      item => {

        const percent =
          total
            ? Math.round(
                (
                  item.hours /
                  total
                )
                *
                100
              )
            : 0;


        const row =
          document
            .createElement("div");

        row.className =
          "stat-row";

        row.innerHTML = `
          <div>

            <div class="stat-person">

              <span
                class="person-dot"
                style="background:${item.color}">
              </span>

              ${safe(item.name)}

            </div>

            <div class="small">
              ${percent} %
            </div>

          </div>

          <strong>
            ${formatHours(
              item.hours
            )}
          </strong>
        `;

        box.appendChild(row);
      }
    );


  if (!total) {

    box.innerHTML =
      `<div class="empty">
        Bez záznamů.
      </div>`;
  }
}


function renderCompanionStats(
  activities,
  school
) {

  const box =
    document
      .getElementById(
        "companionStats"
      );

  const map = {};


  activities.forEach(
    item => {

      if (
        !item.people?.name
      ) {
        return;
      }

      const name =
        item.people.name;

      map[name] =
        (
          map[name] ||
          0
        )
        +
        1;
    }
  );


  school.forEach(
    item => {

      const name =
        item.people?.name;

      if (!name) {
        return;
      }

      map[name] =
        (
          map[name] ||
          0
        )
        +
        1;
    }
  );


  box.innerHTML = "";


  Object
    .entries(map)
    .sort(
      (a,b) =>
        b[1] -
        a[1]
    )
    .forEach(
      ([name,count]) => {

        const row =
          document
            .createElement("div");

        row.className =
          "stat-row";

        row.innerHTML = `
          <div>
            ${safe(name)}
          </div>

          <strong>
            ${count}×
          </strong>
        `;

        box.appendChild(row);
      }
    );


  if (
    !Object.keys(map).length
  ) {

    box.innerHTML =
      `<div class="empty">
        Bez záznamů.
      </div>`;
  }
}


function getOverviewRange() {

  const now =
    new Date();


  if (
    overviewPeriod ===
    "week"
  ) {

    const start =
      new Date(now);

    const index =
      (
        start.getDay() +
        6
      )
      %
      7;

    start.setDate(
      start.getDate() -
      index
    );

    start.setHours(
      0,0,0,0
    );


    const end =
      new Date(start);

    end.setDate(
      end.getDate() + 7
    );


    return {
      start,
      end,
      title:
        "Tento týden"
    };
  }


  if (
    overviewPeriod ===
    "year"
  ) {

    const start =
      new Date(
        now.getFullYear(),
        0,
        1
      );

    const end =
      new Date(
        now.getFullYear() + 1,
        0,
        1
      );


    return {
      start,
      end,
      title:
        String(
          now.getFullYear()
        )
    };
  }


  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );


  const end =
    new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      1
    );


  return {

    start,
    end,

    title:
      now
        .toLocaleDateString(
          "cs-CZ",
          {
            month: "long",
            year: "numeric"
          }
        )
  };
}


/* =====================================================
   MODALY
===================================================== */

function openModal(id) {

  document
    .getElementById(id)
    .classList
    .add("open");

  refreshIcons();
}


function closeModal(id) {

  document
    .getElementById(id)
    .classList
    .remove("open");


  if (
    id ===
    "activityModal"
  ) {

    document
      .getElementById(
        "repeatBtn"
      )
      .disabled =
        false;
  }
}

/* =====================================================
   DATUMY
===================================================== */

function startOfCalendarGrid(
  month
) {

  const first =
    new Date(
      month.getFullYear(),
      month.getMonth(),
      1
    );

  const index =
    (
      first.getDay() +
      6
    )
    %
    7;

  const start =
    new Date(first);

  start.setDate(
    start.getDate() -
    index
  );

  start.setHours(
    0,0,0,0
  );

  return start;
}


function endOfCalendarGrid(
  month
) {

  const last =
    new Date(
      month.getFullYear(),
      month.getMonth() + 1,
      0
    );

  const sundayIndex =
    (
      7 -
      last.getDay()
    )
    %
    7;

  const end =
    new Date(last);

  end.setDate(
    end.getDate() +
    sundayIndex +
    1
  );

  end.setHours(
    0,0,0,0
  );

  return end;
}


function dateKey(date) {

  const d =
    new Date(date);

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    )
    .padStart(
      2,
      "0"
    );

  return (
    `${y}-${m}-${day}`
  );
}


function parseDateKey(key) {

  const [
    y,
    m,
    d
  ] =
    key
      .split("-")
      .map(Number);

  return new Date(
    y,
    m - 1,
    d
  );
}


function localDateTime(date) {

  const d =
    new Date(date);

  const pad =
    n =>
      String(n)
        .padStart(
          2,
          "0"
        );

  return (
    d.getFullYear()
    +
    "-"
    +
    pad(
      d.getMonth() + 1
    )
    +
    "-"
    +
    pad(
      d.getDate()
    )
    +
    "T"
    +
    pad(
      d.getHours()
    )
    +
    ":"
    +
    pad(
      d.getMinutes()
    )
  );
}


function combineDateAndTime(
  date,
  time
) {

  const [
    h,
    m
  ] =
    time
      .split(":")
      .map(Number);

  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate(),
    h,
    m
  );
}


function formatTime(
  value
) {

  return new Date(value)
    .toLocaleTimeString(
      "cs-CZ",
      {
        hour:
          "2-digit",
        minute:
          "2-digit"
      }
    );
}


function formatOnlyTime(
  value
) {

  return new Date(value)
    .toLocaleTimeString(
      "cs-CZ",
      {
        hour:
          "2-digit",
        minute:
          "2-digit"
      }
    );
}


function formatHours(
  hours
) {

  const minutes =
    Math.round(
      hours *
      60
    );

  const h =
    Math.floor(
      minutes /
      60
    );

  const m =
    minutes %
    60;


  if (!m) {

    return `${h} h`;
  }


  return (
    `${h} h ${m} min`
  );
}


/* =====================================================
   BEZPEČNÝ TEXT
===================================================== */

function safe(value) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}
