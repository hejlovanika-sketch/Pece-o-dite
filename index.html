<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Péče o dítě</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-top: 0;
    }

    .card {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Péče o dítě</h1>
    <p class="subtitle">Rodinný přehled</p>

    <div class="card">
      <h2>Dnes</h2>
      <p>Zatím tu nejsou žádné záznamy.</p>
      <button class="primary">+ Přidat péči</button>
    </div>

    <div class="card">
      <h2>Osoby</h2>
      <p>Máma</p>
      <p>Táta</p>
      <p>Babička Bezděz</p>
      <p>Babička Jablonec</p>
      <p>Teta 1</p>
      <p>Teta 2</p>
    </div>

  </div>

</body>
</html>
